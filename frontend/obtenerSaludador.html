<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obtener saludador</title>
</head>
<body>
    <h1>Obtener saludador</h1>
    <button onclick="obtener()">Obtener saludador</button>

    <script>
        function obtener(){
            url = "http://localhost:8080/obtenerSaludador";
            fetch(url)
            .then(async respuesta => {
                r = await respuesta.json()
                console.log( r )
                return r
            })
            .then( data => {
                console.log(data)
            })
            .catch(error =>{
                console.log(error)
            })
        }
    </script>
</body>
</html>
